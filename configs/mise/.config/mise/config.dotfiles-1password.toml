# Machine-specific mise config, loaded when dotfiles-mise-env lists this module
# in MISE_ENV. See "Machine modules" in AI.md.

# Machines with the 1Password app: git signs through git-ssh-sign
[dotfiles]
"~/.config/git/config-1password" = "~/dotfiles/configs/git-1password/.config/git/config-1password"
"~/.local/bin/git-ssh-sign" = "~/dotfiles/configs/git-1password/.local/bin/git-ssh-sign"

# 1Password's signing tool, linked to one fixed path for git-ssh-sign. Each
# entry applies on one OS only; the link is absolute (relative = false).
[dotfiles.op-ssh-sign-macos]
source = "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"
mode = "symlink"
relative = false
variants = [{ os = "macos", target = "~/.local/bin/op-ssh-sign" }]

[dotfiles.op-ssh-sign-linux]
source = "/opt/1Password/op-ssh-sign"
mode = "symlink"
relative = false
variants = [{ os = "linux", target = "~/.local/bin/op-ssh-sign" }]

# On macOS, 1Password's SSH agent socket lives in its app container; link it
# where ~/.ssh/config looks. On Linux, 1Password creates it there itself.
[dotfiles.agent-socket-macos]
source = "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
mode = "symlink"
relative = false
variants = [{ os = "macos", target = "~/.1password/agent.sock" }]
