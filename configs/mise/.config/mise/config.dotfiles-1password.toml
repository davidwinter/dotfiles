# Machine-specific mise config, loaded when dotfiles-mise-env lists this module
# in MISE_ENV. See docs/mise-migration-plan.md.

# Machines with the 1Password app: git signs through git-ssh-sign
[dotfiles]
"~/.config/git/config-1password" = "~/dotfiles/configs/git-1password/.config/git/config-1password"
"~/.local/bin/git-ssh-sign" = "~/dotfiles/configs/git-1password/.local/bin/git-ssh-sign"
