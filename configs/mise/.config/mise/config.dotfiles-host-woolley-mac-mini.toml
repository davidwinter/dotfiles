# The Mac mini home server. Loaded on the machine whose hostname is
# woolley-mac-mini (dotfiles-mise-env); see "Machine modules" in AI.md.

# Packages from the shared config this machine skips. mise can't negate an
# env filter, so each entry is re-declared here (same key, which replaces the
# shared entry) for an environment that's never active.
[bootstrap.packages]
"mas:1451685025" = { env = "dotfiles-skip" } # WireGuard: Spotlight is off here, so mas can't list apps
"brew-cask:tailscale-app" = { env = "dotfiles-skip" } # installed here from the App Store
"brew-cask:localsend" = { env = "dotfiles-skip" } # installed here from the App Store
"brew-cask:alfred" = { env = "dotfiles-skip" } # not needed on the server
