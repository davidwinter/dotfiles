# Machine setup for these dotfiles, applied by mise bootstrap (see AI.md).
# Machine-specific config lives in config.dotfiles-<module>.toml files next to
# this one, selected by MISE_ENV (set from dotfiles-mise-env).

[settings]
dotfiles.root = "~/dotfiles/configs"
dotfiles.relative_symlinks = true

# Dotfiles: each group links one package directory into ~ with one symlink per
# file (symlink-each), keeping directories real so files apps create there
# (known_hosts, fish_variables, ...) stay out of the repo. Groups that only
# apply to some machines are file entries in the config.dotfiles-*.toml
# modules instead, because a module's group list would replace this one.
[bootstrap]
dotfile_groups = ["git", "ssh", "fish", "starship", "hushlogin", "nano", "vim", "mise", "claude", "zed", "scripts"]

# Removed files: links to scripts deleted from the repo. Delete each entry
# once every machine has updated past it.
[dotfiles]
"~/.local/bin/dotfiles-install" = { mode = "absent" }

[dotfile_groups.git]
root = "git"
mode = "symlink-each"

[dotfile_groups.ssh]
root = "ssh"
mode = "symlink-each"
exclude = [".gitignore"]

[dotfile_groups.fish]
root = "fish"
mode = "symlink-each"
exclude = [".gitignore"]

[dotfile_groups.starship]
root = "starship"
mode = "symlink-each"

[dotfile_groups.hushlogin]
root = "hushlogin"
mode = "symlink-each"

[dotfile_groups.nano]
root = "nano"
mode = "symlink-each"

[dotfile_groups.vim]
root = "vim"
mode = "symlink-each"

[dotfile_groups.mise]
root = "mise"
mode = "symlink-each"

[dotfile_groups.claude]
root = "claude"
mode = "symlink-each"

[dotfile_groups.zed]
root = "zed"
mode = "symlink-each"

[dotfile_groups.scripts]
root = "../scripts" # the dotfiles-* helpers, outside configs/
mode = "symlink-each"

[tools]
"github:aristocratos/btop" = {version = "latest", os = "linux"}
starship = "latest"
eza = "latest"
lazygit = "latest"
lazydocker = "latest"
zellij = "latest"
claude-code = "latest"
"github:cli/cli" = "latest"
node = "lts"
uv = "latest"
herdr = "latest"
"github:sinelaw/fresh" = "latest"

# System packages and apps, installed by mise bootstrap with each platform's
# package manager; entries for a manager that isn't installed are skipped.
# "latest" means "installed"; mise doesn't upgrade them. On macOS, git and
# curl come with the system. Homebrew casks download the vendor's own
# installer (check with `brew info --cask <name>`).
[bootstrap.packages]
# Needed by the dotfiles scripts (stow only for old migrations; see
# "Pending cleanup" in AI.md)
"pacman:git" = "latest"
"pacman:stow" = "latest"
"pacman:curl" = "latest"
"apt:git" = "latest"
"apt:stow" = "latest"
"apt:curl" = "latest"
"brew:stow" = { os = "macos" }

# Shell and font
"pacman:fish" = "latest"
"apt:fish" = "latest"
"brew:fish" = { os = "macos" }
"pacman:ttf-jetbrains-mono-nerd" = "latest"
"apt:fonts-jetbrains-mono" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }

# macOS apps (btop comes from [tools] on Linux)
"brew:btop" = { os = "macos" }
"brew-cask:firefox" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:transmission" = { os = "macos" }
"brew-cask:vlc" = { os = "macos" }
"brew-cask:dropbox" = { os = "macos" }
"brew-cask:claude" = { os = "macos" } # desktop app (Claude Code comes from [tools])

# Mac App Store apps, by App Store ID. Needs the mas tool and you signed in to
# the App Store. WireGuard's Mac app is only on the App Store (WireGuard LLC).
"brew:mas" = { os = "macos" }
"mas:1451685025" = { os = "macos" } # WireGuard

# Login shell: mise adds fish to /etc/shells if needed and runs chsh only
# when the login shell isn't fish already. It takes effect at the next login.
[bootstrap.user]
login_shell = "fish"

# macOS preferences, applied by mise bootstrap (Linux skips them). Some only
# take effect after `killall Dock Finder SystemUIServer` or logging out; dark
# mode needs a log out.
[bootstrap.macos.dock]
orientation = "left"
autohide = true
tilesize = 36
show_recents = false
mru_spaces = false # Mission Control: don't rearrange Spaces by recent use
apps = ["/System/Applications/System Settings.app"] # Finder is always there

[bootstrap.macos.finder]
preferred_view_style = "column"

# Hot corners (mise's Dock section has no keys for them). Actions: 10 = put
# display to sleep, 13 = lock screen; modifier 0 = no key held.
[bootstrap.macos.defaults."com.apple.dock"]
wvous-bl-corner = 10
wvous-bl-modifier = 0
wvous-br-corner = 13
wvous-br-modifier = 0

[bootstrap.macos.defaults.NSGlobalDomain]
AppleInterfaceStyle = "Dark"
AppleShowAllExtensions = true
"com.apple.sound.beep.feedback" = 1 # play feedback when volume changes

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableStandardClickToShowDesktop = false # clicking the wallpaper doesn't reveal the desktop
StandardHideWidgets = true # no widgets on the desktop

[bootstrap.macos.defaults."com.apple.finder"]
NewWindowTarget = "PfHm" # new windows open your home folder, not Recents

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowSeconds = true

# Control + scroll to zoom. macOS protects this domain: the terminal running
# the update may need Full Disk Access to write it.
[bootstrap.macos.defaults."com.apple.universalaccess"]
closeViewScrollWheelToggle = true
