# Machine setup is moving to mise bootstrap: see docs/mise-migration-plan.md.
# Machine-specific config lives in config.dotfiles-<module>.toml files next to
# this one, selected by MISE_ENV (set from dotfiles-mise-env).

[settings]
dotfiles.root = "~/dotfiles/configs"
dotfiles.relative_symlinks = true

[tools]
"github:aristocratos/btop" = {version = "latest", os = "linux"}
starship = "latest"
eza = "latest"
lazygit = "latest"
lazydocker = "latest"
zellij = "latest"
claude-code = "latest"
"github:cli/cli" = "latest"
node = "lts"
uv = "latest"
herdr = "latest"
"github:sinelaw/fresh" = "latest"

# System packages and apps, installed by mise bootstrap. Homebrew casks
# download the vendor's own installer (check with `brew info --cask <name>`).
[bootstrap.packages]
"brew-cask:firefox" = { os = "macos" }

# macOS preferences, applied by mise bootstrap (Linux skips them). Some only
# take effect after `killall Dock Finder SystemUIServer` or logging out; dark
# mode needs a log out.
[bootstrap.macos.dock]
orientation = "left"
autohide = true
tilesize = 36
show_recents = false
mru_spaces = false # Mission Control: don't rearrange Spaces by recent use
apps = ["/System/Applications/System Settings.app"] # Finder is always there

[bootstrap.macos.finder]
preferred_view_style = "column"

[bootstrap.macos.defaults.NSGlobalDomain]
AppleInterfaceStyle = "Dark"
AppleShowAllExtensions = true
"com.apple.sound.beep.feedback" = 1 # play feedback when volume changes

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableStandardClickToShowDesktop = false # clicking the wallpaper doesn't reveal the desktop
StandardHideWidgets = true # no widgets on the desktop

[bootstrap.macos.defaults."com.apple.finder"]
NewWindowTarget = "PfHm" # new windows open your home folder, not Recents

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowSeconds = true

# Control + scroll to zoom. macOS protects this domain: the terminal running
# the update may need Full Disk Access to write it.
[bootstrap.macos.defaults."com.apple.universalaccess"]
closeViewScrollWheelToggle = true
