# Machine-specific mise config, loaded when dotfiles-mise-env lists this module
# in MISE_ENV. See "Machine modules" in AI.md.

# Omarchy: Hyprland overrides. Omarchy 4 loads them from hypr/hyprland.lua,
# after its own defaults.
[dotfiles]
"~/.config/hypr/bindings.lua" = "~/dotfiles/configs/omarchy/.config/hypr/bindings.lua"
"~/.config/hypr/autostart.lua" = "~/dotfiles/configs/omarchy/.config/hypr/autostart.lua"

# Omarchy's bar: the clock, world clock and widgets (bar.layout). The bar
# replaces shell.json whenever it saves, so a link wouldn't last; mise writes
# just these keys into the real file instead, and the bar picks them up
# straight away. A change made in the bar's settings is undone by the next
# update, so make it in this file. version is there for a machine without
# shell.json yet, which mise creates from these keys alone.
"~/.config/omarchy/shell.json/bar" = { source = "~/dotfiles/configs/omarchy/.config/omarchy/shell-bar.json", merge = true }

# Retired with Omarchy 4: Hyprland no longer reads the .conf files, and the
# Quickshell bar replaced Waybar. Removes the old links.
"~/.config/hypr/bindings.conf" = { mode = "absent" }
"~/.config/hypr/autostart.conf" = { mode = "absent" }
"~/.config/waybar/config.jsonc" = { mode = "absent" }
